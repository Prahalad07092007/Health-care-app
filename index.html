    const playHapticTone = (type = 'click') => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'chime') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(1040, now + 0.12);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (type === 'alert') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.setValueAtTime(440, now + 0.08);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
          osc.start(now);
          osc.stop(now + 0.16);
        }
      } catch (e) {
        // AudioContext blocked until user interacts with document
      }

    // ==========================================
    // REAL-TIME CANVAS ECG WAVEFORM MONITOR
    // Simulates realistic physiological P-Q-R-S-T cardiac cycle
    // ==========================================
    const ECGWaveform = ({ bpm = 64, isStreaming = true }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        const width = canvas.width;
        const height = canvas.height;
        const midY = height / 2;

        const points = [];
        let cycleTime = 0;

        const getECGSample = (phase) => {
          if (phase > 0.15 && phase < 0.25) {
            return Math.sin((phase - 0.15) * 10 * Math.PI) * 5; // P wave
          } else if (phase >= 0.32 && phase < 0.34) {
            return -6; // Q dip
          } else if (phase >= 0.34 && phase < 0.38) {
            return 32; // R spike
          } else if (phase >= 0.38 && phase < 0.41) {
            return -10; // S dip
          } else if (phase > 0.48 && phase < 0.65) {
            return Math.sin((phase - 0.48) * 5.88 * Math.PI) * 9; // T wave
          }
          return (Math.random() - 0.5) * 1.2; // Baseline
        };

        const render = () => {
          const beatDuration = Math.max(30, (60 / Math.max(40, bpm)) * 50);
          cycleTime = (cycleTime + 1) % beatDuration;
          const phase = cycleTime / beatDuration;
          const sample = getECGSample(phase);

          points.push(sample);
          if (points.length > width) {
            points.shift();
          }

          // Clear trail
          ctx.fillStyle = 'rgba(10, 16, 28, 0.25)';
          ctx.fillRect(0, 0, width, height);

          // Grid lines
          ctx.strokeStyle = 'rgba(0, 245, 255, 0.05)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let gy = 10; gy < height; gy += 15) {
            ctx.moveTo(0, gy);
            ctx.lineTo(width, gy);
          }
          ctx.stroke();

          // Waveform
          ctx.beginPath();
          ctx.strokeStyle = '#00F5FF';
          ctx.lineWidth = 2;
          ctx.shadowColor = '#00F5FF';
          ctx.shadowBlur = 8;

          for (let i = 0; i < points.length; i++) {
            const px = i;
            const py = midY - points[i];
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();
          ctx.shadowBlur = 0;

          // Scanning sweep head
          if (points.length > 0) {
            const headX = points.length - 1;
            const headY = midY - points[headX];
            ctx.fillStyle = '#FFFFFF';
            ctx.shadowColor = '#00F5FF';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(headX, headY, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => cancelAnimationFrame(animationFrameId);
      }, [bpm, isStreaming]);

      return (
        <div className="relative w-full h-20 rounded-xl overflow-hidden bg-slate-950/70 border border-cyan-500/20">
          <canvas ref={canvasRef} width={340} height={80} className="w-full h-full block ecg-canvas" />
          <div className="absolute top-2 left-2 flex items-center space-x-1.5 text-[10px] font-mono text-cyan-400 bg-cyan-950/60 px-2 py-0.5 rounded-full border border-cyan-500/30">
            <span className="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping" />
            <span>LEAD II • ECG 500Hz</span>
          </div>
          <div className="absolute bottom-1.5 right-2 text-[9px] font-mono text-slate-500">
            25mm/s • 10mm/mV
          </div>
        </div>
      );
    };

    // ==========================================
    // RECHARTS & BESPOKE HYBRID CHART COMPONENT
    // Seamlessly leverages Recharts when present, with native SVG fallback
    // ==========================================
    const DualTelemetryChart = ({ data, metricKey, color = "#00F5FF", height = 240, unit = "" }) => {
      const [hoveredIdx, setHoveredIdx] = useState(null);

      // Check if Recharts UMD is available in window
      const hasRecharts = typeof window.Recharts !== 'undefined';

      if (hasRecharts) {
        const { ResponsiveContainer, AreaChart, Area, XAxis, YAxis, Tooltip, CartesianGrid } = window.Recharts;
        return (
          <div style={{ width: '100%', height }}>
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={data} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                <defs>
                  <linearGradient id={`grad-${metricKey}`} x1="0" y1="0" x2="0" y2="1">
                    <stop offset="5%" stopColor={color} stopOpacity={0.4} />
                    <stop offset="95%" stopColor={color} stopOpacity={0.0} />
                  </linearGradient>
                </defs>
                <CartesianGrid strokeDasharray="3 3" stroke="rgba(255, 255, 255, 0.05)" vertical={false} />
                <XAxis dataKey="time" stroke="#64748B" fontSize={11} tickLine={false} axisLine={false} />
                <YAxis stroke="#64748B" fontSize={11} tickLine={false} axisLine={false} />
                <Tooltip
                  content={({ active, payload, label }) => {
                    if (active && payload && payload.length) {
                      return (
                        <div className="bg-slate-900/95 border border-slate-700 p-2.5 rounded-xl shadow-xl text-xs backdrop-blur-md">
                          <p className="text-[10px] text-slate-400 font-mono">{label || payload[0].payload.day}</p>
                          <p className="text-white font-bold flex items-center gap-1 mt-0.5">
                            <span style={{ color }}>{payload[0].value}</span>
                            <span className="text-[10px] text-slate-400 font-normal">{unit}</span>
                          </p>
                        </div>
                      );
                    }
                    return null;
                  }}
                />
                <Area
                  type="monotone"
                  dataKey={metricKey}
                  stroke={color}
                  strokeWidth={2.5}
                  fillOpacity={1}
                  fill={`url(#grad-${metricKey})`}
                />
              </AreaChart>
            </ResponsiveContainer>
          </div>
        );
      }

      // Native High-Precision SVG Fallback
      const values = data.map(d => d[metricKey]);
      const minVal = Math.min(...values) * 0.92;
      const maxVal = Math.max(...values) * 1.08;
      const range = maxVal - minVal || 1;

      const points = data.map((d, i) => {
        const x = (i / (data.length - 1)) * 100;
        const y = 100 - ((d[metricKey] - minVal) / range) * 80 - 10;

                          </div>
                          <div className="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                            <div style={{ width: `${z.pct}%`, backgroundColor: z.color }} className="h-full rounded-full" />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Workout Feed */}
                  <div className="glass-panel rounded-2xl p-6 border border-white/5 space-y-4">
                    <h3 className="text-sm font-bold text-white">Logged Workout History</h3>
                    <div className="space-y-3">
                      {activities.map((act) => (
                        <div key={act.id} className="p-3.5 rounded-xl bg-slate-950/40 border border-white/5 flex items-center justify-between">
                          <div className="flex items-center space-x-3.5">
                            <div className="w-10 h-10 rounded-xl bg-cyan-500/10 text-cyan-400 flex items-center justify-center shrink-0">
                              <Icon name={act.icon} size={18} />
                            </div>
                            <div>
                              <div className="text-xs font-bold text-white">{act.type} • <span className="font-mono text-slate-400">{act.time}</span></div>
                              <div className="text-[11px] text-slate-400 font-mono mt-0.5">Duration: {act.duration} • Avg: {act.hrAvg}</div>
                            </div>
                          </div>
                          <div className="text-right">
                            <div className="text-xs font-bold text-amber-400 font-mono">+{act.calories} kcal</div>
                            <div className="text-[10px] font-mono text-cyan-400">Strain {act.strain}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 5: HYDRATION & NUTRITION */}
              {activeTab === 'hydration' && (
                <div className="space-y-6">
                  <div className="glass-panel rounded-2xl p-6 border border-white/5 space-y-6">
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                          <Icon name="droplets" size={18} className="text-blue-400" />
                          <span>Fluid Homeostasis & Electrolyte Osmolarity</span>
                        </h3>
                        <p className="text-xs text-slate-400 mt-0.5">Dynamic intake calculations matched against workout sweat rate</p>
                      </div>
                      <span className="text-xs font-mono text-cyan-400 bg-cyan-500/10 px-3 py-1 rounded-xl border border-cyan-500/20 font-semibold">
                        {Math.round((vitals.hydration / vitals.hydrationGoal) * 100)}% Fulfilled
                      </span>
                    </div>

                    {/* Fluid Tank Visualizer */}
                    <div className="relative h-44 w-full bg-slate-950/80 rounded-2xl border border-blue-500/30 overflow-hidden flex flex-col justify-end p-4">
                      {/* Animated Fluid Wave Layer */}
                      <div
                        style={{ height: `${Math.min(100, (vitals.hydration / vitals.hydrationGoal) * 100)}%` }}
                        className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-blue-600/40 via-cyan-500/30 to-cyan-400/20 transition-all duration-700 backdrop-blur-sm"
                      >
                        <div className="w-full h-2 bg-cyan-400/50 shadow-glow-cyan" />
                      </div>

                      <div className="relative z-10 flex items-end justify-between">
                        <div>
                          <div className="text-3xl font-extrabold text-white font-mono">{vitals.hydration} <span className="text-sm font-normal text-slate-300">mL</span></div>
                          <div className="text-xs text-cyan-300 font-mono mt-0.5">Target Daily Pacing: {vitals.hydrationGoal} mL</div>
                        </div>

                        {/* Quick Add Buttons */}
                        <div className="flex items-center space-x-2">
                          <button
                            onClick={() => addHydration(250)}
                            className="px-3.5 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs transition-all shadow-glow-cyan"
                          >
                            +250 mL
                          </button>
                          <button
                            onClick={() => addHydration(500)}
                            className="px-3.5 py-2 rounded-xl bg-blue-500 hover:bg-blue-400 text-white font-bold text-xs transition-all shadow-glow-cyan"
                          >
                            +500 mL
                          </button>
                          <button
                            onClick={() => addHydration(750)}
                            className="px-3.5 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 text-white font-bold text-xs transition-all shadow-glow-violet"
                          >
                            +750 mL
                          </button>
                        </div>
                      </div>
                    </div>

                    {/* Electrolyte Balances */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                      <div className="p-3.5 rounded-xl bg-slate-950/50 border border-white/5">
                        <div className="text-[10px] text-slate-400 font-mono uppercase">Sodium (Na+) Retention</div>
                        <div className="text-lg font-bold text-white font-mono mt-1">2,140 mg</div>
                        <div className="text-[10px] text-emerald-400">Electrolyte homeostasis balanced</div>
                      </div>
                      <div className="p-3.5 rounded-xl bg-slate-950/50 border border-white/5">
                        <div className="text-[10px] text-slate-400 font-mono uppercase">Potassium (K+) Reserve</div>
                        <div className="text-lg font-bold text-white font-mono mt-1">3,420 mg</div>
                        <div className="text-[10px] text-emerald-400">Optimal intracellular hydration</div>
                      </div>
                      <div className="p-3.5 rounded-xl bg-slate-950/50 border border-white/5">
                        <div className="text-[10px] text-slate-400 font-mono uppercase">Sweat Loss Deficit</div>
                        <div className="text-lg font-bold text-amber-400 font-mono mt-1">450 mL</div>
                        <div className="text-[10px] text-slate-400">Post-run rehydration required</div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 6: TARGET MILESTONES & GOALS */}
              {activeTab === 'goals' && (
                <div className="space-y-6">
                  <div className="glass-panel rounded-2xl p-6 border border-white/5 space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                          <Icon name="award" size={18} className="text-amber-400" />
                          <span>Customized Target Health Milestones</span>
                        </h3>
                        <p className="text-xs text-slate-400 mt-0.5">Weekly biological pacing benchmarks and progression tracking</p>
                      </div>
                      <button
                        onClick={() => setShowGoalModal(true)}
                        className="px-3.5 py-1.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs shadow-glow-cyan"
                      >
                        Adjust Targets
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                      {goals.map((g) => {
                        const pct = Math.min(100, Math.round((g.current / g.target) * 100));
                        return (
                          <div key={g.id} className="p-4 rounded-xl bg-slate-950/50 border border-white/5 space-y-2">
                            <div className="flex justify-between items-center">
                              <span className="text-xs font-bold text-white">{g.label}</span>
                              <span className="text-xs font-mono text-cyan-400 font-bold">{pct}%</span>
                            </div>
                            <div className="text-sm font-mono text-slate-300">
                              {g.current.toLocaleString()} / <span className="font-bold text-white">{g.target.toLocaleString()} {g.unit}</span>
                            </div>
                            <div className="h-2.5 w-full bg-slate-800 rounded-full overflow-hidden">
                              <div
                                style={{ width: `${pct}%` }}
                                className="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 rounded-full shadow-glow-cyan transition-all duration-500"
                              />
                            </div>
                            <div className="text-[10px] text-slate-400 flex justify-between font-mono pt-1">
                              <span>Status: {pct >= 100 ? 'Completed' : 'On Track'}</span>
                              <span>Remaining: {Math.max(0, g.target - g.current)} {g.unit}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              )}

              {/* TAB 7: AI HEALTH CORE */}
              {activeTab === 'insights' && (
                <div className="space-y-6">
                  <div className="glass-panel rounded-2xl p-6 border border-white/5 space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <h3 className="text-base font-bold text-white flex items-center gap-2">
                          <Icon name="sparkles" size={18} className="text-cyan-400" />
                          <span>BioSync Clinical Intelligence Agent</span>
                        </h3>
                        <p className="text-xs text-slate-400 mt-0.5">Machine learning inferences cross-referenced with your historical biometrics</p>
                      </div>
                      <span className="text-xs font-mono text-cyan-400 bg-cyan-500/10 px-3 py-1 rounded-xl border border-cyan-500/20 font-semibold">
                        Neural Core v3.2 Active
                      </span>
                    </div>

                    {/* Pre-canned Prompts */}
                    <div className="flex flex-wrap gap-2 pt-2">
                      {[
                        "How is my cardiac recovery today?",
                        "Analyze my REM sleep latency",
                        "Evaluate sweat fluid deficit",
                        "Recommend optimal training intensity",
                      ].map((prompt, i) => (
                        <button
                          key={i}
                          onClick={() => {
                            setAiQuery(prompt);
                            triggerSound('click');
                          }}
                          className="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-cyan-500/40 text-xs text-slate-300 hover:text-white transition-all"
                        >
                          {prompt}
                        </button>
                      ))}
                    </div>

                    {/* Form */}
                    <form onSubmit={handleAiDiagnostic} className="relative mt-2">
                      <input
                        type="text"
                        value={aiQuery}
                        onChange={(e) => setAiQuery(e.target.value)}
                        placeholder="Type any health, recovery, or physiological question..."
                        className="w-full bg-slate-950/90 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 pr-24"
                      />
                      <button
                        type="submit"
                        disabled={isAiLoading || !aiQuery.trim()}
                        className="absolute right-2 top-2 px-4 py-1.5 bg-cyan-500 hover:bg-cyan-400 disabled:opacity-50 text-black font-bold text-xs rounded-lg transition-all shadow-glow-cyan"
                      >
                        {isAiLoading ? 'Analyzing...' : 'Execute AI'}
                      </button>
                    </form>

                    {/* Result Card */}
                    {aiResponse && (
                      <div className="p-4 rounded-xl bg-slate-950/80 border border-cyan-500/30 space-y-2 animate-fadeIn">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-cyan-400 font-mono flex items-center gap-1.5">
                            <Icon name="sparkles" size={14} />
                            <span>Clinical Inference Output</span>
                          </span>
                          <span className="text-[10px] text-slate-500 font-mono">Confidence: 99.4%</span>
                        </div>
                        <p className="text-xs text-slate-200 leading-relaxed font-sans">{aiResponse}</p>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </main>

          {/* ========================================================= */}
          {/* MODAL: LOG NEW ACTIVITY */}
          {/* ========================================================= */}
          {showActivityModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
              <div className="glass-panel w-full max-w-md rounded-2xl p-6 border border-slate-700 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-white/5">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <Icon name="plus" size={18} className="text-cyan-400" />
                    <span>Log Biometric Workout Session</span>
                  </h3>
                  <button onClick={() => setShowActivityModal(false)} className="p-1 rounded-lg text-slate-400 hover:text-white">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const act = {
                      id: Date.now(),
                      type: form.actType.value,
                      icon: form.actType.value.includes('Run') ? 'activity' : form.actType.value.includes('Yoga') ? 'zap' : 'flame',
                      duration: `${form.actDuration.value} min`,
                      calories: Number(form.actCalories.value),
                      strain: Number(form.actStrain.value),
                      time: 'Just now',
                      status: 'Completed',
                      hrAvg: `${form.actHR.value} bpm`
                    };
                    handleLogActivity(act);
                  }}
                  className="space-y-3.5 text-xs"
                >
                  <div>
                    <label className="block text-slate-300 font-medium mb-1">Session Modality</label>
                    <select
                      name="actType"
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-cyan-400"
                    >
                      <option value="Trail Run">Trail Run (Endurance)</option>
                      <option value="Strength Training">Strength / Hypertrophy</option>
                      <option value="HIIT Intervals">HIIT Cardiovascular</option>
                      <option value="Road Cycling">Road Cycling</option>
                      <option value="Breathwork & Yoga">Mindful Breathwork & Yoga</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Duration (min)</label>
                      <input
                        type="number"
                        name="actDuration"
                        defaultValue={45}
                        required
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-cyan-400"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Active Burn (kcal)</label>
                      <input
                        type="number"
                        name="actCalories"
                        defaultValue={360}
                        required
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-cyan-400"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Avg HR (BPM)</label>
                      <input
                        type="number"
                        name="actHR"
                        defaultValue={138}
                        required
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-cyan-400"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Strain Score (0 - 21)</label>
                      <input
                        type="number"
                        name="actStrain"
                        step="0.1"
                        defaultValue={11.5}
                        required
                        className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-cyan-400"
                      />
                    </div>
                  </div>

                  <div className="pt-2 flex items-center justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setShowActivityModal(false)}
                      className="px-4 py-2 rounded-xl text-slate-300 hover:bg-white/5 transition-colors"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold shadow-glow-cyan transition-all"
                    >
                      Save Session
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: GOALS ADJUSTMENT */}
          {/* ========================================================= */}
          {showGoalModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
              <div className="glass-panel w-full max-w-md rounded-2xl p-6 border border-slate-700 shadow-2xl space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-white/5">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <Icon name="award" size={18} className="text-amber-400" />
                    <span>Adjust Health Target Milestones</span>
                  </h3>
                  <button onClick={() => setShowGoalModal(false)} className="p-1 rounded-lg text-slate-400 hover:text-white">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-300 font-medium mb-1">Daily Step Goal</label>
                    <input
                      type="number"
                      defaultValue={vitals.stepGoal}
                      onChange={(e) => setVitals(prev => ({ ...prev, stepGoal: Number(e.target.value) }))}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-cyan-400"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-medium mb-1">Daily Hydration Target (mL)</label>
                    <input
                      type="number"
                      defaultValue={vitals.hydrationGoal}
                      onChange={(e) => setVitals(prev => ({ ...prev, hydrationGoal: Number(e.target.value) }))}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-cyan-400"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-medium mb-1">Active Calorie Target (kcal)</label>
                    <input
                      type="number"
                      defaultValue={vitals.calorieGoal}
                      onChange={(e) => setVitals(prev => ({ ...prev, calorieGoal: Number(e.target.value) }))}
                      className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs focus:outline-none focus:border-cyan-400"
                    />
                  </div>

                  <div className="pt-2 flex justify-end">
                    <button
                      onClick={() => {
                        setShowGoalModal(false);
                        showToast("Milestone targets updated successfully!");
                      }}
                      className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs shadow-glow-cyan transition-all"
                    >
                      Update Benchmarks
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: PROFILE & HARDWARE */}
          {/* ========================================================= */}
          {showProfileModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
              <div className="glass-panel w-full max-w-lg rounded-2xl p-6 border border-slate-700 shadow-2xl space-y-5">
                <div className="flex items-center justify-between pb-3 border-b border-white/5">
                  <div className="flex items-center space-x-3">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-cyan-500 to-indigo-600 flex items-center justify-center font-bold text-sm text-white ring-4 ring-cyan-500/20">
                      GP
                    </div>
                    <div>
                      <h3 className="text-base font-bold text-white">Guda Prahalad</h3>
                      <p className="text-xs text-cyan-400 font-mono">Athlete ID: #BIO-4921 • Pro Plan Active</p>
                    </div>
                  </div>
                  <button onClick={() => setShowProfileModal(false)} className="p-1 rounded-lg text-slate-400 hover:text-white">
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="grid grid-cols-3 gap-2.5 text-center text-xs">
                  <div className="p-2.5 rounded-xl bg-slate-950/60 border border-white/5">
                    <div className="text-[10px] text-slate-400 uppercase font-mono">VO2 Max</div>
                    <div className="text-base font-bold text-white font-mono mt-0.5">54.2</div>
                    <div className="text-[9px] text-emerald-400">Superior Tier</div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-slate-950/60 border border-white/5">
                    <div className="text-[10px] text-slate-400 uppercase font-mono">Bio-Age Delta</div>
                    <div className="text-base font-bold text-emerald-400 font-mono mt-0.5">-4.2 yrs</div>
                    <div className="text-[9px] text-slate-400">Cellular Vitality</div>
                  </div>
                  <div className="p-2.5 rounded-xl bg-slate-950/60 border border-white/5">
                    <div className="text-[10px] text-slate-400 uppercase font-mono">Basal Rate</div>
                    <div className="text-base font-bold text-cyan-400 font-mono mt-0.5">1,740</div>
                    <div className="text-[9px] text-slate-400">kcal / day</div>
                  </div>
                </div>

                <div>
                  <h4 className="text-xs font-bold text-white uppercase tracking-wider font-mono mb-2">Connected Wearables</h4>
                  <div className="space-y-2">
                    <div className="p-3 rounded-xl bg-slate-950/40 border border-white/5 flex items-center justify-between text-xs">
                      <div className="flex items-center space-x-3">
                        <Icon name="watch" size={18} className="text-cyan-400" />
                        <div>
                          <div className="font-semibold text-white">Apple Watch Ultra 2</div>
                          <div className="text-[10px] text-slate-400 font-mono">PPG Vitals, Accelerometer, ECG</div>
                        </div>
                      </div>
                      <span className="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">Connected (98%)</span>
                    </div>

                    <div className="p-3 rounded-xl bg-slate-950/40 border border-white/5 flex items-center justify-between text-xs">
                      <div className="flex items-center space-x-3">
                        <Icon name="shield" size={18} className="text-violet-400" />
                        <div>
                          <div className="font-semibold text-white">Oura Ring Gen 4</div>
                          <div className="text-[10px] text-slate-400 font-mono">Circadian Thermometer, Sleep Stages</div>
                        </div>
                      </div>
                      <span className="text-[10px] font-mono text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">Connected (84%)</span>
                    </div>
                  </div>
                </div>

                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => {
                      setShowProfileModal(false);
                      showToast("Wearables recalibrated successfully!");
                    }}
                    className="px-4 py-2 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-black font-bold text-xs shadow-glow-cyan transition-all"
                  >
                    Sync & Calibrate Sensors
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
